css_config:
  inputs:
    EM_mics_apix: {from: input.em_settings.EM_mics_apix}

    micrograph_upper_bound_x: 3838 # {from: input.user.micrograph_number_rows} # todo: get/compute from micrograph or metadata
    micrograph_upper_bound_y: 3710 # {from: input.user.micrograph_number_cols} # todo: get/compute from micrograph or metadata

    ### binning related ###
    large_binning_pixel_size   : {from: workflow.calc_pixel_size-lbin.output.angpix}
    large_binning_ref3d_path   : "$BASEDIR/create_volume-lbin/lbin.mrc"
    large_binning_mask3d_path  : "$BASEDIR/create_mask-lbin/prot_mask_final.mrc"
    large_binning_factor : {from: input.user.large_binning_factor,  default: 4.00}

    medium_binning_pixel_size   : {from: workflow.calc_pixel_size-mbin.output.angpix}
    medium_binning_ref3d_path: "$BASEDIR/create_volume-mbin/mbin.mrc"
    medium_binning_mask3d_path  : "$BASEDIR/create_mask-mbin/prot_mask_final.mrc"
    medium_binning_factor: {from: input.user.medium_binning_factor, default: 1.24}

    padding_pixels    : {from: input.user.padding_pixels,     default: 0}
    padding_angstrom  : {from: input.user.padding_angstrom,   default: 0}
    padding_percentage: {from: input.user.padding_percentage, default: 0}

    reference_particle_size_pix:        {from: workflow.calc_mask_size-lbin.output.diameter}
    reference_particle_size_angpix:     {from: workflow.calc_mask_size-lbin.output.voxel_size}

    initial3d_particle_size_pix:        {from: workflow.calc_size_negative_density_region.output.sphere_negative.diameter}
    initial3d_particle_size_angpix:     {from: workflow.calc_size_negative_density_region.output.sphere_negative.voxel_size}

    ctflimit_boxsize_pix:               {from: workflow.calc_ctf_boxsize.output.boxsize}
    ctflimit_boxsize_angpix:            {from: workflow.calc_ctf_boxsize.output.pixel_size}

  params_to_compute:
    # Common    
    - SS_comm_class2d_pmd
    - SS_comm_optimal_pmd

    - SS_comm_lbin_angpix
    - SS_comm_lbin_ref3d_path
    - SS_comm_lbin_ref3d_name
    - SS_comm_lbin_mask3d_path
    - SS_comm_lbin_mask3d_name
    
    - SS_comm_mbin_angpix
    - SS_comm_mbin_ref3d_path
    - SS_comm_mbin_ref3d_name
    - SS_comm_mbin_mask3d_path
    - SS_comm_mbin_mask3d_name

    # 030_GTF_Create_Stack
    - GTF_lbin_extract_mics_box
    - GTF_lbin_extract_mics_0o95box
    - GTF_lbin_extract_parts_box
    - GTF_lbin_extract_parts_x_min
    - GTF_lbin_extract_parts_x_max
    - GTF_lbin_extract_parts_y_min
    - GTF_lbin_extract_parts_y_max

    # 050_GTF_AbInitReconst3D
    # - GTF_lbin_abinit3d_pmd

    # 070_CSS_Init_Refine3D
    - CSS_mbin_reextract_mics_box
    - CSS_mbin_reextract_mics_0o95box
    - CSS_mbin_reextract_parts_box
    - CSS_mbin_reextract_parts_x_min
    - CSS_mbin_reextract_parts_x_max
    - CSS_mbin_reextract_parts_y_min
    - CSS_mbin_reextract_parts_y_max