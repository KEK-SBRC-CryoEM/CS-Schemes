css_config:
  inputs:
    EM_mics_apix: {from: input.em_settings.EM_mics_apix}

    mics_upper_bound: {from: input.user.mics_size} # todo: get/compute from micrograph or metadata

    ref3d_path : {from: input.user.reference_map_filepath}
    mask3d_path: "$BASEDIR/mask_generation_reference_map/prot_mask_final.mrc"

    large_binning_factor : {from: input.user.large_binning_factor,  default: 4.00}
    medium_binning_factor: {from: input.user.medium_binning_factor, default: 1.24}

    padding_pixels    : {from: input.user.padding_pixels,     default: 0}
    padding_angstrom  : {from: input.user.padding_angstrom,   default: 0}
    padding_percentage: {from: input.user.padding_percentage, default: 0}

    reference_particle_size_pix:        {from: workflow.calc_mask_size_lbin.output.diameter}
