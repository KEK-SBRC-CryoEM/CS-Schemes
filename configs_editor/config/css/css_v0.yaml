    initial3d_particle_size_angpix:     {from: workflow.calc_size_negative_density_region.output.sphere_negative.voxel_size}

    ctflimit_boxsize_pix:               {from: workflow.calc_ctf_boxsize.output.boxsize}
    ctflimit_boxsize_angpix:            {from: workflow.calc_ctf_boxsize.output.pixel_size}

