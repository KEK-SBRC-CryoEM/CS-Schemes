workflow:
  ### REFERENCE VOLUME ALIGNMENT ###
  #### 1. Create Mask for alignment
  #### 2. Calc Mask Size to load some volume properties (future: replace by a stats method)
  #### 3. Align
  - name: create_mask-reference_volume # gmm mode
    command: deepmasc_contour
    args:
      - ["--input_map_path", {from: input.user.reference_map_filepath}]
      - ["--output_folder",  "$OUTDIR"]
      - ["--gpu_id"        , "0,1"]
      - ["--num_components", "2"]
      - ["--batch_size"    , "8"]
      - ["--morph_radius"  , "3"]
      - ["--mask_diameter" , "95"]
      - ["--cutoff_prob"   , "0.3"]

  - name: calc_size-reference_volume
    command: size_estimation
    args:
      - "--json"
      - ["--volume", "$BASEDIR/create_mask-reference_volume/prot_mask_final.mrc"]

  - name: volume_alignment-reference_volume
    command: volume_alignment
    args:
      - ["--volume", {from: input.user.reference_map_filepath}]
      - ["--mask",   "$BASEDIR/create_mask-reference_volume/prot_mask_final.mrc"]
      - "--json"
      - "--save"
      - "--verbose"
      - ["--output-dir", "$OUTDIR"] 

  ### LBIN ###
  #### 1. Calc Upsampling parameters
  #### 2. Upsample the map
  #### 3. Create a mask for it
  #### 4. Compute mask size
  - name: calc_pixel_size-lbin
    command: python
    args:
      - "-c"
      - 'import json, sys; print(json.dumps({"angpix": float(sys.argv[1]) * float(sys.argv[2])}))'
      - {from: workflow.calc_size-reference_volume.output.voxel_size}
      - {from: input.user.large_binning_factor}

  - name: create_volume-lbin
    command: relion_image_handler
    args:
      - ["--i",              {from: input.user.reference_map_filepath}]
      - ["--rescale_angpix", {from: workflow.calc_pixel_size-lbin.output.angpix}]
      - ["--o", "$OUTDIR/lbin.mrc"]

  - name: create_mask-lbin # gmm mode
    command: deepmasc_contour
    args:
      - ["--input_map_path", "$BASEDIR/create_volume-lbin/lbin.mrc"]
      - ["--output_folder",  "$OUTDIR"]
      - ["--gpu_id"        , "0,1"]
      - ["--num_components", "2"]
      - ["--batch_size"    , "8"]
      - ["--morph_radius"  , "3"]
      - ["--mask_diameter" , "95"]
      - ["--cutoff_prob"   , "0.3"]

  - name: calc_mask_size-lbin
    command: size_estimation
    args:
      - "--json"
      - ["--volume", "$BASEDIR/create_mask-lbin/prot_mask_final.mrc"]
 
  ### MBIN ###
  #### 1. Calc Upsampling parameters
  #### 2. Upsample the map
  #### 3. Create a mask for it
  #### 4. Compute mask size
  - name: calc_pixel_size-mbin
    command: python
    args:
      - "-c"
      - 'import json, sys; print(json.dumps({"angpix": float(sys.argv[1]) * float(sys.argv[2])}))'
      - {from: workflow.calc_size-reference_volume.output.voxel_size}
      - {from: input.user.medium_binning_factor}
      
  - name: create_volume-mbin
    command: relion_image_handler
    args:
      - ["--i", {from: input.user.reference_map_filepath}]
      - ["--rescale_angpix", {from: workflow.calc_pixel_size-mbin.output.angpix}]
      - ["--o", "$OUTDIR/mbin.mrc"]

  - name: create_mask-mbin # cryoread mode
    command: deepmasc_contour
    args:
      - ["--input_map_path", "$BASEDIR/create_volume-mbin/mbin.mrc"]
      - ["--output_folder",  "$OUTDIR"] # --output-dir must be the absolute path for this to work
      - ["--gpu_id"        , "0,1"]
      - ["--num_components", "2"]
      - ["--batch_size"    , "8"]
      - ["--morph_radius"  , "3"]
      - ["--mask_diameter" , "95"]
      - ["--cutoff_prob"   , "0.3"]
      - ["--refinement_mask"]

  - name: calc_mask_size-mbin
    command: size_estimation
    args:
      - "--json"
      - ["--volume", "$BASEDIR/create_mask-mbin/prot_mask_final.mrc"]

  ### NEGATIVE DENSITY ###
  - name: calc_size_negative_density_region
    command: negative_estimation
    args:
      - "--json"
      - ["--output-dir", "$OUTDIR"]
      - ["--volume",     "$BASEDIR/create_volume-mbin/mbin.mrc"]
      - ["--mask",       "$BASEDIR/create_mask-mbin/prot_mask_final.mrc"]

  ### FRESNEL BOX SIZE ###
  - name: calc_fresnel_boxsize
    command: boxsize_analysis
    args:
      - "--json"
      - "fresnel"
      - ["--particle_diameter", {from: workflow.calc_mask_size-mbin.output.diameter}]
      - ["--voltage",           {from: input.em_settings.EM_kV}]
      - ["--defocus",           {from: input.user.defocus, default: 1}]
      - ["--resolution",        {from: input.user.target_resolution, default: 3}]

  ### CTF LIMIT BOXSIZE ###
  - name: calc_ctf_boxsize
    command: boxsize_analysis
    args:
      - "--json"
      - ["--output-dir", "$OUTDIR"]
      - "opt"
      - ["--pixel_size", {from: input.em_settings.EM_mics_apix}]
      - ["--voltage",    {from: input.em_settings.EM_kV}]
      - ["--defocus",    {from: input.user.defocus, default: 0}]
      - ["--cs",         {from: input.em_settings.EM_Cs}]
      - "--save_plots"
